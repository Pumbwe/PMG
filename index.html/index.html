<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PMG-Academics — Portal</title>
  <meta name="description" content="PMG-Academics portal: notes, past papers, assignments and lab reports organized by program." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg:#070712; --card:#0f1116; --muted:#9aa4b2; --gold:#FFD700; --accent:#2b9cff; --glass:rgba(255,255,255,0.03);
      --max-width:1200px;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,Arial;color:#f7f7f7;background:linear-gradient(180deg,#05050a,#0b0b10)}
    .wrap{max-width:var(--max-width);margin:28px auto;padding:20px}
    header.hero{display:flex;gap:18px;align-items:center;justify-content:space-between;padding:22px;border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));border:1px solid rgba(255,255,255,0.03)}
    .brand{display:flex;gap:14px;align-items:center}
    .logo{width:56px;height:56px;border-radius:10px;background:linear-gradient(135deg,var(--gold),#ff8c00);display:flex;align-items:center;justify-content:center;color:#0b0b10;font-weight:900;font-family:Playfair Display}
    h1{margin:0;font-family:Playfair Display,serif;color:var(--gold);font-size:1.6rem}
    .subtitle{color:var(--muted);font-size:0.95rem}
    .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .input{padding:10px 12px;border-radius:10px;background:var(--glass);border:1px solid rgba(255,255,255,0.04);color:inherit;min-width:260px}
    .btn{padding:10px 14px;border-radius:12px;background:linear-gradient(135deg,var(--gold),#ff8c00);color:#0b0b10;font-weight:800;text-decoration:none;border:0;cursor:pointer}
    .muted{color:var(--muted)}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
    @media (max-width:980px){ .grid{grid-template-columns:repeat(2,1fr)} }
    @media (max-width:640px){ .grid{grid-template-columns:1fr} .input{min-width:140px} }
    .program{background:linear-gradient(180deg,rgba(255,255,255,0.01),rgba(255,255,255,0.005));padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,0.03);display:flex;flex-direction:column;gap:12px}
    .program-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .program-title{font-weight:800;color:var(--gold)}
    .program-meta{color:var(--muted);font-size:0.9rem}
    .sections{display:flex;gap:8px;flex-wrap:wrap}
    .section-pill{padding:8px 10px;border-radius:999px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.02);font-weight:700;color:var(--muted);display:inline-flex;gap:8px;align-items:center}
    .section-pill a{color:inherit;text-decoration:none}
    .counts{font-weight:800;color:#fff}
    .card-footer{display:flex;justify-content:space-between;align-items:center;gap:12px}
    .viewer{margin-top:18px;border-radius:12px;overflow:hidden;display:none;border:1px solid rgba(255,255,255,0.03)}
    .viewer iframe{width:100%;height:640px;border:0;background:#fff}
    .search-hint{font-size:0.9rem;color:var(--muted)}
    .controls{display:flex;gap:8px;align-items:center}
    .small{font-size:0.9rem;color:var(--muted)}
    .recent{margin-top:18px;padding:12px;border-radius:12px;background:rgba(255,255,255,0.01);border:1px solid rgba(255,255,255,0.02)}
    .recent li{padding:8px 0;border-bottom:1px dashed rgba(255,255,255,0.02)}
    .recent li:last-child{border-bottom:0}
    .empty{color:var(--muted);padding:18px;text-align:center}
    .kbd{background:rgba(255,255,255,0.04);padding:4px 8px;border-radius:6px;font-family:monospace}
  </style>
</head>
<body>
  <div class="wrap" role="main">
    <header class="hero" role="banner" aria-label="PMG portal header">
      <div class="brand">
        <div class="logo" aria-hidden="true">PMG</div>
        <div>
          <h1>PMG-Academics</h1>
          <div class="subtitle">Notes • Past Papers • Assignments • Lab Reports — manifest-driven portal</div>
        </div>
      </div>

      <div class="toolbar" role="region" aria-label="Toolbar">
        <input id="search" class="input" type="search" placeholder="Search programs, course codes, topics…" aria-label="Search programs and courses" />
        <div class="controls">
          <button id="expandAll" class="btn" title="Expand all programs">Expand all</button>
          <button id="collapseAll" class="btn" title="Collapse all">Collapse all</button>
        </div>
      </div>
    </header>

    <section id="programsGrid" class="grid" aria-live="polite" aria-label="Programs list">
      <!-- Program cards injected here -->
    </section>

    <section id="viewer" class="viewer" aria-label="Document viewer">
      <iframe id="viewerFrame" title="Document viewer"></iframe>
    </section>

    <section class="recent" aria-label="Recent activity">
      <strong>Recent activity</strong>
      <ul id="recentList">
        <li class="empty">No recent updates found in manifest.</li>
      </ul>
    </section>

    <footer style="margin-top:18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
      <div class="small">© 2026 PMG-Academics</div>
      <div class="small">Shortcuts: <span class="kbd">/</span> focus search • <span class="kbd">Esc</span> close viewer</div>
    </footer>
  </div>

  <script>
  (function(){
    const MANIFEST = '/course_manifest.json';
    const programsGrid = document.getElementById('programsGrid');
    const searchEl = document.getElementById('search');
    const expandAllBtn = document.getElementById('expandAll');
    const collapseAllBtn = document.getElementById('collapseAll');
    const viewer = document.getElementById('viewer');
    const frame = document.getElementById('viewerFrame');
    const recentList = document.getElementById('recentList');

    // Utility: safe fetch JSON
    async function fetchJson(url){
      try{
        const r = await fetch(url, {cache:'no-store'});
        if(!r.ok) throw new Error('not found');
        return await r.json();
      }catch(e){ return null; }
    }

    // Utility: fetch a section index and count <li> items (works if index.html lists topics as <li>)
    async function countSectionItems(folder, section){
      const url = `${folder}/${section}/index.html`;
      try{
        const r = await fetch(url, {cache:'no-store'});
        if(!r.ok) return 0;
        const text = await r.text();
        // crude but effective: count <li> occurrences inside the index
        const matches = text.match(/<li[\s>]/gi);
        return matches ? matches.length : 0;
      }catch(e){
        return 0;
      }
    }

    // Build program card
    function makeProgramCard(program){
      const card = document.createElement('article');
      card.className = 'program';
      card.setAttribute('role','article');
      card.setAttribute('aria-label', program.label);

      const head = document.createElement('div');
      head.className = 'program-head';

      const left = document.createElement('div');
      left.innerHTML = `<div class="program-title">${program.label}</div><div class="program-meta">${program.id || ''}</div>`;

      const right = document.createElement('div');
      right.style.textAlign = 'right';
      right.innerHTML = `<div class="small muted">Folder: <span class="muted">${program.folder}</span></div>`;

      head.appendChild(left);
      head.appendChild(right);
      card.appendChild(head);

      // sections row
      const sectionsRow = document.createElement('div');
      sectionsRow.className = 'sections';
      const sections = [
        {key:'notes', label:'Notes'},
        {key:'past-papers', label:'Past Papers'},
        {key:'assignments', label:'Assignments'},
        {key:'lab-reports', label:'Lab Reports'}
      ];

      // placeholder counts while we fetch
      sections.forEach(s=>{
        const pill = document.createElement('div');
        pill.className = 'section-pill';
        pill.innerHTML = `<span>${s.label}</span> <span class="counts" data-folder="${program.folder}" data-section="${s.key}">…</span>`;
        // link to section index
        const a = document.createElement('a');
        a.href = `${program.folder}/${s.key}/index.html`;
        a.title = `${program.label} — ${s.label}`;
        a.addEventListener('click', (ev)=>{ ev.preventDefault(); openInViewer(a.href); });
        pill.style.cursor = 'pointer';
        pill.addEventListener('click', ()=> openInViewer(a.href));
        sectionsRow.appendChild(pill);
      });
      card.appendChild(sectionsRow);

      // description / courses list
      const desc = document.createElement('div');
      desc.className = 'muted';
      desc.style.marginTop = '8px';
      desc.textContent = program.description || (program.courses && program.courses.length ? program.courses.map(c=>c.code+' — '+c.title).join(' • ') : 'No description available.');
      card.appendChild(desc);

      // footer with quick links
      const footer = document.createElement('div');
      footer.className = 'card-footer';
      const leftLinks = document.createElement('div');
      leftLinks.innerHTML = `<a class="btn" href="${program.folder}/index.html" data-href="${program.folder}/index.html">Open Program</a>`;
      leftLinks.querySelector('a').addEventListener('click', (ev)=>{ ev.preventDefault(); openInViewer(ev.currentTarget.getAttribute('href')); });

      const rightLinks = document.createElement('div');
      rightLinks.innerHTML = `<span class="small muted">Updated: ${program.lastUpdated || '—'}</span>`;
      footer.appendChild(leftLinks);
      footer.appendChild(rightLinks);
      card.appendChild(footer);

      return card;
    }

    // Open a path in the viewer iframe (relative path)
    function openInViewer(path){
      // normalize relative path: if path starts with '/', remove leading slash to keep repo-root relative behavior
      const normalized = path.replace(/^\/+/,'');
      frame.src = normalized;
      viewer.style.display = 'block';
      frame.focus();
      // scroll viewer into view
      viewer.scrollIntoView({behavior:'smooth'});
    }

    function closeViewer(){
      frame.src = '';
      viewer.style.display = 'none';
    }

    // Load manifest and render
    async function render(){
      const manifest = await fetchJson(MANIFEST) || { programs: [] };
      programsGrid.innerHTML = '';
      const cards = [];
      for(const p of (manifest.programs || [])){
        const card = makeProgramCard(p);
        programsGrid.appendChild(card);
        cards.push({card, program:p});
      }

      // populate counts by fetching section index pages
      const countEls = document.querySelectorAll('.counts');
      countEls.forEach(async el=>{
        const folder = el.dataset.folder;
        const section = el.dataset.section;
        const n = await countSectionItems(folder, section);
        el.textContent = n;
        el.title = `${n} items`;
      });

      // recent activity from manifest (if present)
      recentList.innerHTML = '';
      const recent = (manifest.programs || []).slice().sort((a,b)=>{
        const ta = a.lastUpdated ? new Date(a.lastUpdated).getTime() : 0;
        const tb = b.lastUpdated ? new Date(b.lastUpdated).getTime() : 0;
        return tb - ta;
      }).slice(0,8);
      if(recent.length === 0){
        recentList.innerHTML = '<li class="empty">No recent updates found in manifest.</li>';
      }else{
        recent.forEach(r=>{
          const li = document.createElement('li');
          li.innerHTML = `<strong>${r.label}</strong> <span class="muted">(${r.folder})</span><div class="small muted">Updated: ${r.lastUpdated || '—'}</div>`;
          li.addEventListener('click', ()=> {
            // open program overview
            openInViewer(`${r.folder}/index.html`);
          });
          recentList.appendChild(li);
        });
      }

      // store for search
      window._pmg_cards = cards;
    }

    // Search and filter
    function applySearch(q){
      const query = (q||'').trim().toLowerCase();
      const cards = window._pmg_cards || [];
      cards.forEach(({card, program})=>{
        const text = (program.label + ' ' + (program.courses||[]).map(c=>c.code+' '+c.title).join(' ')).toLowerCase();
        const match = !query || text.includes(query);
        card.style.display = match ? '' : 'none';
      });
    }

    // Keyboard shortcuts
    document.addEventListener('keydown', (e)=>{
      if(e.key === '/' && !e.metaKey && !e.ctrlKey){
        e.preventDefault();
        searchEl.focus();
      }
      if(e.key === 'Escape'){
        closeViewer();
      }
    });

    // Wire up controls
    searchEl.addEventListener('input', (e)=> applySearch(e.target.value));
    expandAllBtn.addEventListener('click', ()=>{
      // open all program overview pages in viewer sequentially (open first only to avoid many iframes)
      const cards = window._pmg_cards || [];
      if(cards.length) openInViewer(`${cards[0].program.folder}/index.html`);
    });
    collapseAllBtn.addEventListener('click', ()=> closeViewer());

    // Boot
    render();
    // expose helpers for debugging
    window._pmg = { render, openInViewer, closeViewer, applySearch };
  })();
  </script>
</body>
</html>
