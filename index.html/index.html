<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PMG-Academics — CBU Programs</title>
  <meta name="description" content="Portal for Copperbelt University programs — click a program to view courses, then notes, past papers, assignments, lab reports." />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#070712; --panel:#0f1116; --muted:#9aa4b2; --gold:#FFD700; --blue:#2b9cff;
      --glass: rgba(255,255,255,0.03); --radius:14px; --maxw:1200px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,Arial;background:linear-gradient(180deg,#05050a,#0b0b10);color:#f6f6f6;-webkit-font-smoothing:antialiased}
    .wrap{max-width:var(--maxw);margin:28px auto;padding:20px}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{display:flex;gap:12px;align-items:center}
    .logo{width:56px;height:56px;border-radius:12px;background:linear-gradient(135deg,var(--gold),#ff8c00);display:flex;align-items:center;justify-content:center;color:#0b0b10;font-weight:900;font-family:Playfair Display}
    h1{margin:0;font-family:Playfair Display,serif;color:var(--gold);font-size:1.6rem}
    .subtitle{color:var(--muted);font-size:0.95rem}
    .layout{display:grid;grid-template-columns:320px 1fr 420px;gap:18px;margin-top:18px}
    @media (max-width:1100px){ .layout{grid-template-columns:1fr; } .right-panel{order:3} }
    .panel{background:linear-gradient(180deg,rgba(255,255,255,0.01),rgba(255,255,255,0.005));padding:14px;border-radius:var(--radius);border:1px solid rgba(255,255,255,0.03)}
    .program-list{display:flex;flex-direction:column;gap:8px}
    .program-btn{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:transparent;border:1px solid rgba(255,255,255,0.03);cursor:pointer;transition:all .18s}
    .program-btn:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(0,0,0,0.6)}
    .program-btn.active{background:linear-gradient(90deg,var(--blue),#1b6fd6);border-color:rgba(43,156,255,0.18);color:#fff}
    .program-title{font-weight:700}
    .courses{margin-top:12px;display:none;flex-direction:column;gap:8px}
    .courses.open{display:flex}
    .course-item{padding:8px 10px;border-radius:8px;background:rgba(255,255,255,0.02);cursor:pointer;border:1px solid rgba(255,255,255,0.02)}
    .course-item:hover{background:rgba(255,255,255,0.03)}
    .course-item.active{background:linear-gradient(90deg,rgba(43,156,255,0.12),rgba(43,156,255,0.06));border-color:rgba(43,156,255,0.12)}
    .sections{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
    .section-btn{padding:8px 10px;border-radius:999px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.02);cursor:pointer}
    .section-btn.active{background:var(--blue);color:#fff;border-color:rgba(255,255,255,0.06)}
    .viewer{border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,0.03);display:none}
    .viewer iframe{width:100%;height:640px;border:0;background:#fff}
    .right-panel .box{margin-bottom:12px}
    .years{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
    .year-btn{padding:8px 10px;border-radius:8px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.02);cursor:pointer}
    .year-btn.active{background:linear-gradient(90deg,var(--blue),#1b6fd6);color:#fff}
    .list{margin-top:12px}
    .list a{display:block;padding:8px;border-radius:8px;text-decoration:none;color:inherit;background:rgba(255,255,255,0.01);margin-bottom:6px;border:1px solid rgba(255,255,255,0.02)}
    .empty{color:var(--muted);padding:12px;text-align:center}
    .search{margin-top:12px;display:flex;gap:8px}
    .input{flex:1;padding:10px;border-radius:10px;background:var(--glass);border:1px solid rgba(255,255,255,0.04);color:inherit}
    .btn{padding:8px 12px;border-radius:10px;background:linear-gradient(135deg,var(--gold),#ff8c00);color:#0b0b10;font-weight:700;border:0;cursor:pointer}
    .small{font-size:0.9rem;color:var(--muted)}
    .breadcrumb{font-size:0.9rem;color:var(--muted);margin-bottom:8px}
    .faint{color:rgba(255,255,255,0.03);font-size:8rem;position:fixed;right:10px;bottom:10px;pointer-events:none;user-select:none}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <div class="logo">PMG</div>
        <div>
          <h1>PMG-Academics</h1>
          <div class="subtitle">Copperbelt University — Programs, Courses, Notes & Past Papers</div>
        </div>
      </div>
      <div class="small">Press <span class="small" style="background:rgba(255,255,255,0.04);padding:4px 6px;border-radius:6px">/</span> to focus search</div>
    </header>

    <div class="layout" role="region" aria-label="Main layout">
      <!-- LEFT: Programs -->
      <aside class="panel" aria-label="Programs panel">
        <div class="breadcrumb">CBU Programs</div>
        <div class="search">
          <input id="search" class="input" placeholder="Filter programs or courses…" aria-label="Search programs and courses">
          <button id="clear" class="btn" title="Clear">Clear</button>
        </div>

        <div style="margin-top:12px" class="program-list" id="programList" role="list">
          <!-- program buttons injected here -->
        </div>
      </aside>

      <!-- CENTER: Courses and sections -->
      <main>
        <div class="panel" aria-live="polite">
          <div class="breadcrumb" id="breadcrumb">Select a program</div>

          <div id="coursesWrap" class="coursesWrap">
            <div id="courses" class="courses" aria-label="Courses list">
              <!-- courses injected here -->
            </div>

            <div id="sections" class="sections" aria-label="Sections" style="margin-top:12px;display:none">
              <button class="section-btn" data-section="notes">Notes</button>
              <button class="section-btn" data-section="past-papers">Past Papers</button>
              <button class="section-btn" data-section="assignments">Assignments</button>
              <button class="section-btn" data-section="lab-reports">Lab Reports</button>
            </div>
          </div>

          <div id="contentArea" style="margin-top:14px">
            <div id="contentList" class="list"></div>
            <div id="empty" class="empty">Choose a program and course to see content.</div>
          </div>
        </div>

        <div id="viewer" class="viewer" style="margin-top:12px">
          <iframe id="viewerFrame" title="Document viewer"></iframe>
        </div>
      </main>

      <!-- RIGHT: Past papers years & quick links -->
      <aside class="panel right-panel" aria-label="Details panel">
        <div class="box">
          <div class="small">Past Papers — Years</div>
          <div class="years" id="years">
            <!-- years 2019-2025 -->
          </div>
        </div>

        <div class="box">
          <div class="small">Quick links</div>
          <div style="margin-top:8px">
            <a id="openPortal" class="btn" href="index.html">Open Portal Root</a>
          </div>
        </div>

        <div class="box">
          <div class="small">Preview</div>
          <div id="preview" class="list"></div>
        </div>
      </aside>
    </div>

    <div class="faint">CBU</div>
  </div>

  <script>
  (function(){
    // Default programs (used if course_manifest.json missing)
    const DEFAULT_MANIFEST = {
      programs: [
        {
          id: "INDUSTRIAL CHEMISTRY SECOND YEAR",
          label: "Industrial Chemistry Second Year",
          folder: "Industrial_chemistry_second_year",
          description: "Organic chemistry, analytical techniques, industrial processes",
          lastUpdated: "2026-01-10",
          courses: [
            { code: "CH260", title: "Organic Chemistry" },
            { code: "CH261", title: "Analytical Chemistry" }
          ]
        },
        {
          id: "FIRST YEAR NQ",
          label: "First Year NQ",
          folder: "FIRST_YEAR_NQ",
          description: "Foundation courses at Copperbelt University",
          lastUpdated: "2026-01-12",
          courses: [
            { code: "CH110", title: "Chemistry" },
            { code: "MA110", title: "Mathematics" }
          ]
        }
      ]
    };

    const programListEl = document.getElementById('programList');
    const coursesEl = document.getElementById('courses');
    const sectionsEl = document.getElementById('sections');
    const contentListEl = document.getElementById('contentList');
    const emptyEl = document.getElementById('empty');
    const breadcrumbEl = document.getElementById('breadcrumb');
    const yearsEl = document.getElementById('years');
    const previewEl = document.getElementById('preview');
    const viewer = document.getElementById('viewer');
    const viewerFrame = document.getElementById('viewerFrame');
    const searchInput = document.getElementById('search');
    const clearBtn = document.getElementById('clear');

    let manifest = DEFAULT_MANIFEST;
    let activeProgram = null;
    let activeCourse = null;
    let activeSection = null;
    let activeYear = null;

    // Load manifest if available
    async function loadManifest(){
      try{
        const r = await fetch('course_manifest.json', {cache:'no-store'});
        if(!r.ok) throw new Error('no manifest');
        const data = await r.json();
        if(data && data.programs && data.programs.length) manifest = data;
      }catch(e){
        // use default manifest
      }
    }

    // Render program buttons
    function renderPrograms(filter){
      programListEl.innerHTML = '';
      const q = (filter||'').trim().toLowerCase();
      manifest.programs.forEach(p=>{
        const text = (p.label + ' ' + (p.courses||[]).map(c=>c.code+' '+c.title).join(' ')).toLowerCase();
        if(q && !text.includes(q)) return;
        const btn = document.createElement('button');
        btn.className = 'program-btn';
        btn.setAttribute('role','listitem');
        btn.innerHTML = `<div style="width:10px;height:10px;border-radius:4px;background:linear-gradient(90deg,var(--gold),#ff8c00)"></div><div><div class="program-title">${p.label}</div><div class="small muted">${p.description || ''}</div></div>`;
        btn.addEventListener('click', ()=> selectProgram(p, btn));
        programListEl.appendChild(btn);
      });
    }

    // Select program
    function selectProgram(p, btnEl){
      // clear previous active
      document.querySelectorAll('.program-btn').forEach(b=>b.classList.remove('active'));
      btnEl.classList.add('active');
      activeProgram = p;
      breadcrumbEl.textContent = `CBU Programs › ${p.label}`;
      renderCourses(p);
      // reset lower selections
      activeCourse = null; activeSection = null; activeYear = null;
      sectionsEl.style.display = 'none';
      contentListEl.innerHTML = ''; emptyEl.style.display = 'block';
      previewEl.innerHTML = '';
      viewer.style.display = 'none';
      // open program index in preview if exists
      previewLink(`${p.folder}/index.html`);
    }

    // Render courses for program
    function renderCourses(program){
      coursesEl.innerHTML = '';
      coursesEl.classList.add('open');
      program.courses.forEach(c=>{
        const item = document.createElement('div');
        item.className = 'course-item';
        item.textContent = `${c.code} — ${c.title}`;
        item.addEventListener('click', ()=> selectCourse(program, c, item));
        coursesEl.appendChild(item);
      });
      // show sections
      sectionsEl.style.display = 'flex';
    }

    // Select course
    function selectCourse(program, course, itemEl){
      // mark active
      document.querySelectorAll('.course-item').forEach(i=>i.classList.remove('active'));
      itemEl.classList.add('active');
      activeCourse = course;
      breadcrumbEl.textContent = `CBU Programs › ${program.label} › ${course.code}`;
      // show sections and default to Notes
      activeSection = null; activeYear = null;
      document.querySelectorAll('.section-btn').forEach(b=>b.classList.remove('active'));
      // show content placeholder
      showSection('notes');
      // preview course index if exists
      previewLink(`${program.folder}/notes/index.html`);
    }

    // Show a section (notes, past-papers, assignments, lab-reports)
    async function showSection(section){
      activeSection = section;
      // highlight section button
      document.querySelectorAll('.section-btn').forEach(b=> b.classList.toggle('active', b.dataset.section === section));
      // clear content list
      contentListEl.innerHTML = '';
      emptyEl.style.display = 'none';
      // If past-papers, show years
      if(section === 'past-papers'){
        renderYears();
      } else {
        yearsEl.innerHTML = '';
      }
      // Try to fetch the section index and list items
      if(!activeProgram || !activeCourse){ emptyEl.style.display = 'block'; return; }
      const folder = activeProgram.folder + '/' + section;
      const indexUrl = `${folder}/index.html`;
      try{
        const r = await fetch(indexUrl, {cache:'no-store'});
        if(!r.ok) throw new Error('no index');
        const text = await r.text();
        // crude parse: find <li> elements and extract inner text and href
        const parser = new DOMParser();
        const doc = parser.parseFromString(text, 'text/html');
        const lis = doc.querySelectorAll('li a');
        if(lis.length === 0){
          // fallback: show raw index link
          contentListEl.innerHTML = `<a href="${indexUrl}" class="btn" onclick="event.preventDefault(); openViewer('${indexUrl}')">Open section index</a>`;
          return;
        }
        lis.forEach(a=>{
          const href = a.getAttribute('href') || a.getAttribute('data-href') || a.textContent.trim();
          const link = document.createElement('a');
          link.href = href;
          link.textContent = a.textContent.trim();
          link.addEventListener('click', (ev)=>{ ev.preventDefault(); openViewer(resolvePath(folder, href)); });
          contentListEl.appendChild(link);
        });
      }catch(e){
        // no index found — show message and a link to create one
        contentListEl.innerHTML = `<div class="empty">No index found for this section. Create <code>${folder}/index.html</code> with a list of topics.</div>`;
      }
    }

    // Render years 2019-2025 for past papers
    function renderYears(){
      yearsEl.innerHTML = '';
      for(let y=2019;y<=2025;y++){
        const btn = document.createElement('button');
        btn.className = 'year-btn';
        btn.textContent = y;
        btn.addEventListener('click', ()=> selectYear(y));
        yearsEl.appendChild(btn);
      }
    }

    // Select year and list past papers for that year
    async function selectYear(y){
      activeYear = y;
      document.querySelectorAll('.year-btn').forEach(b=>b.classList.toggle('active', Number(b.textContent) === y));
      // show list of past papers for the selected year
      if(!activeProgram) return;
      const folder = `${activeProgram.folder}/past-papers`;
      // convention: files named like ch260-2019.html or ch260-2019.pdf (we use html)
      // We'll attempt to list common course codes from manifest for this program
      contentListEl.innerHTML = '';
      const codes = (activeProgram.courses || []).map(c=>c.code.toLowerCase());
      if(codes.length === 0){
        contentListEl.innerHTML = `<div class="empty">No course codes found for this program to generate year links.</div>`;
        return;
      }
      codes.forEach(code=>{
        const filename = `${code}-${y}.html`;
        const path = `${folder}/${filename}`;
        const a = document.createElement('a');
        a.href = path;
        a.textContent = `${code.toUpperCase()} — Past Paper ${y}`;
        a.addEventListener('click', (ev)=>{ ev.preventDefault(); openViewer(path); });
        contentListEl.appendChild(a);
      });
    }

    // Preview link (shows in preview panel)
    function previewLink(path){
      previewEl.innerHTML = '';
      const a = document.createElement('a');
      a.href = path;
      a.textContent = `Preview: ${path}`;
      a.addEventListener('click', (ev)=>{ ev.preventDefault(); openViewer(path); });
      previewEl.appendChild(a);
    }

    // Open viewer iframe
    function openViewer(path){
      const normalized = path.replace(/^\/+/,'');
      viewerFrame.src = normalized;
      viewer.style.display = 'block';
      viewer.scrollIntoView({behavior:'smooth'});
    }

    // Resolve relative hrefs against folder
    function resolvePath(folder, href){
      if(href.startsWith('http') || href.startsWith('/')) return href.replace(/^\/+/,'');
      if(href.startsWith('./')) return folder + '/' + href.slice(2);
      if(href.startsWith('../')) return folder + '/' + href; // crude
      return folder + '/' + href;
    }

    // Wire up section buttons
    document.querySelectorAll('.section-btn').forEach(b=>{
      b.addEventListener('click', ()=> showSection(b.dataset.section));
    });

    // Search and clear
    searchInput.addEventListener('input', ()=> renderPrograms(searchInput.value));
    clearBtn.addEventListener('click', ()=> { searchInput.value=''; renderPrograms(''); });

    // Keyboard: focus search with '/'
    document.addEventListener('keydown', (e)=>{
      if(e.key === '/' && !e.metaKey && !e.ctrlKey){
        e.preventDefault(); searchInput.focus();
      }
      if(e.key === 'Escape'){
        viewer.style.display = 'none';
        viewerFrame.src = '';
      }
    });

    // Initialize years area (empty until past-papers selected)
    yearsEl.innerHTML = '<div class="small muted">Select Past Papers to show years</div>';

    // Boot
    (async function boot(){
      await loadManifest();
      renderPrograms();
      // pre-create years buttons but hidden until past-papers selected
      // (we create them dynamically in renderYears)
    })();

    // Expose for debugging
    window._pmg = { manifest, renderPrograms, selectProgram, selectCourse: (p,c)=>selectCourse(p,c,document.querySelector('.course-item')), openViewer };
  })();
  </script>
</body>
</html>
