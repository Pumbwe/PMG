<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>PMG™ EDU | Legendary Courses</title>

<style>
:root{
  --bg:#0f0f0f; --card:#1b1b1b; --ink:#f0f0f0;
  --gold:#FFD700; --blue:#2563eb;
}
*{box-sizing:border-box}
body{
  margin:0; font-family:Inter,system-ui;
  background:var(--bg); color:var(--ink);
  text-align:center; padding:20px;
}
h1{color:var(--gold)}
.section{background:var(--card);padding:20px;border-radius:12px;max-width:1100px;margin:auto}
.course{border:1px solid #333;border-radius:12px;padding:16px;margin:16px 0;text-align:left}
.course h2{color:var(--gold)}
.row{display:flex;gap:10px;flex-wrap:wrap}
button{padding:10px;border-radius:10px;border:none;font-weight:700;background:var(--blue);color:#fff}
button.ghost{background:transparent;color:var(--gold);border:1px solid #444}
.years{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pill{padding:8px 14px;border-radius:999px;background:#111;border:1px solid #444;cursor:pointer}
.viewer{display:none;margin-top:20px}
iframe{width:100%;height:75vh;border:none;border-radius:10px;background:#fff}
</style>
</head>

<body>

<h1>PMG™ EDU</h1>
<p>Legendary Academic Resources</p>

<div class="section">

<div id="contentViewer" class="viewer">
  <iframe id="contentFrame"></iframe>
</div>

<!-- ================= INDUSTRIAL CHEMISTRY ================= -->
<h2 style="color:gold">Industrial Chemistry – Second Year</h2>

<div class="course">
<h2>CH260 – Organic Chemistry</h2>
<div class="row">
  <button onclick="showYears('CH260')">Tests</button>
</div>
<div id="CH260-years" class="years"></div>
</div>

<!-- ================= FIRST YEAR NQ ================= -->
<h2 style="color:gold;margin-top:30px">First Year NQ</h2>

<div class="course">
<h2>BI110 – Biology</h2>
<div class="row">
  <button onclick="showYears('BI110')">Tests</button>
</div>
<div id="BI110-years" class="years"></div>
</div>

<div class="course">
<h2>CH110 – Chemistry</h2>
<div class="row">
  <button onclick="showYears('CH110')">Tests</button>
</div>
<div id="CH110-years" class="years"></div>
</div>

<div class="course">
<h2>MA110 – Mathematics</h2>
<div class="row">
  <button onclick="showYears('MA110')">Tests</button>
</div>
<div id="MA110-years" class="years"></div>
</div>

</div>

<script>
/* ========= COURSE → FOLDER MAP ========= */
const COURSE_PATHS = {
  CH260: "course/SECOND_YEAR/INDUSTRIAL_CHEMISTRY/CH260/TEST_PAPERS/",
  BI110: "course/FIRST_YEAR_NQ/BI110/TEST_PAPERS/",
  CH110: "course/FIRST_YEAR_NQ/CH110/TEST_PAPERS/",
  MA110: "course/FIRST_YEAR_NQ/MA110/TEST_PAPERS/"
};

/* ========= SHOW YEARS ========= */
function showYears(course){
  const box = document.getElementById(course + "-years");
  box.innerHTML = "";
  [2019,2020,2021,2022,2023,2024].forEach(y=>{
    const p = document.createElement("div");
    p.className = "pill";
    p.innerText = y;
    p.onclick = ()=>openPaper(course, y);
    box.appendChild(p);
  });
}

/* ========= OPEN HTML PAPER ========= */
function openPaper(course, year){
  const viewer = document.getElementById("contentViewer");
  const frame = document.getElementById("contentFrame");
  frame.src = COURSE_PATHS[course] + year + ".html";
  viewer.style.display = "block";
  viewer.scrollIntoView({behavior:"smooth"});
}
</script>

</body>
</html>
