<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMG™ EDU | All Courses</title>

<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background:#0f0f0f;
  color:#f0f0f0;
  text-align:center;
  padding:20px;
}
h1 { color:#FFD700; }
.section {
  background:#1b1b1b;
  padding:20px;
  border-radius:12px;
  max-width:900px;
  margin:20px auto;
}
button {
  padding:12px 20px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}
.paper-btn {
  background:#2563eb;
  color:#fff;
  width:100%;
  margin:5px 0;
}
.hidden { display:none; }
iframe { border:none; }
input {
  padding:10px;
  width:80%;
  max-width:300px;
}
</style>
</head>

<body>

<h1>PMG™ EDU</h1>
<p><b>Academic Resources</b></p>

<!-- AUTH -->
<div id="auth" class="section">
  <input id="email" placeholder="Email"><br><br>
  <input id="password" type="password" placeholder="Password"><br><br>
  <button onclick="login()">Login</button>
  <button onclick="register()">Register</button>
</div>

<!-- USER PANEL -->
<div id="userPanel" class="section hidden">
  <p id="statusText"></p>
</div>

<!-- CONTENT -->
<div id="content" class="section hidden">
  <h3>MA110 – Past Papers</h3>

  <button class="paper-btn" onclick="openPaper('MA110-2019.html')">
    Open MA110 2019
  </button>

  <button class="paper-btn" onclick="openPaper('MA110-2019-solutions.html')">
    Open MA110 2019 – Solutions
  </button>

  <!-- NEW SECTION: INDUSTRIAL CHEMISTRY -->
  <h3 style="margin-top:30px;">Industrial Chemistry Courses</h3>

  <button class="paper-btn" onclick="openPaper('organic-chemistry.html')">
    Organic Chemistry
  </button>

  <button class="paper-btn" onclick="openPaper('analytical-chemistry.html')">
    Analytical Chemistry
  </button>

  <button class="paper-btn" onclick="openPaper('industrial-chemistry.html')">
    Industrial Chemistry
  </button>

  <button class="paper-btn" onclick="openPaper('industrial-physics.html')">
    Industrial Physics
  </button>

  <button class="paper-btn" onclick="openPaper('industrial-mathematics.html')">
    Industrial Mathematics – Test Papers & Assignments
  </button>

  <!-- HTML VIEWER -->
  <div id="contentViewer" class="hidden" style="margin-top:20px;">
    <iframe id="contentFrame" width="100%" height="600px"></iframe>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import {
  getFirestore,
  doc,
  setDoc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* 🔴 PUT YOUR REAL FIREBASE CONFIG HERE */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* UI ELEMENTS */
const authDiv = document.getElementById("auth");
const userPanel = document.getElementById("userPanel");
const content = document.getElementById("content");
const contentViewer = document.getElementById("contentViewer");
const contentFrame = document.getElementById("contentFrame");
const statusText = document.getElementById("statusText");

/* UI HELPERS */
function showAuth(){
  authDiv.classList.remove("hidden");
  userPanel.classList.add("hidden");
  content.classList.add("hidden");
}
function showUserUI(){
  authDiv.classList.add("hidden");
  userPanel.classList.remove("hidden");
  content.classList.remove("hidden");
}

/* REGISTER */
window.register = async () => {
  if(!email.value || !password.value){
    alert("Enter email and password");
    return;
  }
  const res = await createUserWithEmailAndPassword(auth, email.value, password.value);
  await setDoc(doc(db,"users",res.user.uid),{
    email: email.value,
    role: "user"
  });
  alert("Registered! Login now.");
};

/* LOGIN */
window.login = async () => {
  await signInWithEmailAndPassword(auth, email.value, password.value);
};

/* AUTH STATE */
onAuthStateChanged(auth, async user=>{
  if(!user){
    showAuth();
    return;
  }
  const snap = await getDoc(doc(db,"users",user.uid));
  const data = snap.data();
  showUser(data);
});

/* SHOW USER */
function showUser(data){
  showUserUI();
  contentViewer.classList.add("hidden");
  statusText.innerText = `Welcome, ${data.email}`;
}

/* OPEN HTML PAST PAPER */
window.openPaper = async (file)=>{
  loadHTML(file);
};

/* LOAD HTML */
function loadHTML(file){
  contentViewer.classList.remove("hidden");
  contentFrame.src = `https://pumbwe.github.io/PMG/past-papers/${file}`;
}

/* DISABLE RIGHT CLICK */
document.addEventListener("contextmenu", e => e.preventDefault());
</script>

</body>
</html>
