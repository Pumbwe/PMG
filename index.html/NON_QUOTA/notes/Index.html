<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NON-QUOTA | Engineering Notes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.4em;
            letter-spacing: 2px;
        }

        p.subtitle {
            text-align: center;
            margin-bottom: 30px;
            opacity: 0.85;
        }

        .courses {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
        }

        .code {
            font-size: 1.4em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .name {
            font-size: 1em;
            opacity: 0.9;
        }

        footer {
            margin-top: 30px;
            text-align: center;
            font-size: 0.85em;
            opacity: 0.7;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>NON-QUOTA NOTES</h1>
    <p class="subtitle">Engineering Foundation • Year One</p>

    <div class="courses">
        <div class="card">
            <div class="code">MA110</div>
            <div class="name">Mathematics</div>
        </div>

        <div class="card">
            <div class="code">CH110</div>
            <div class="name">Chemistry</div>
        </div>

        <div class="card">
            <div class="code">CS110</div>
            <div class="name">Computer Science</div>
        </div>

        <div class="card">
            <div class="code">BI110</div>
            <div class="name">Biology</div>
        </div>

        <div class="card">
            <div class="code">PH110</div>
            <div class="name">Physics</div>
        </div>
    </div>

    <footer>
        Built for NON-QUOTA Engineers • Discipline • Consistency • Growth
    </footer>
</div>

</body>
  </html>
