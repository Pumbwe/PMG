<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NON-QUOTA | First Year Notes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #eef1f5;
            color: #2c2c2c;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 900px;
            background: #ffffff;
            border-radius: 8px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        header {
            text-align: center;
            border-bottom: 2px solid #e1e5ea;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        header h1 {
            margin: 0;
            font-size: 2em;
            letter-spacing: 1px;
        }

        header p {
            margin-top: 8px;
            font-size: 0.95em;
            color: #555;
        }

        .courses {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        a.card {
            text-decoration: none;
            color: inherit;
            border: 1px solid #dce1e7;
            border-radius: 6px;
            padding: 22px;
            background: #fafbfc;
            transition: all 0.25s ease;
        }

        a.card:hover {
            background: #f0f4f8;
            border-color: #b9c6d3;
            transform: translateY(-4px);
        }

        .code {
            font-size: 1.3em;
            font-weight: 600;
            margin-bottom: 6px;
            color: #1f3a5f;
        }

        .name {
            font-size: 0.95em;
            color: #444;
        }

        footer {
            margin-top: 35px;
            text-align: center;
            font-size: 0.8em;
            color: #777;
            border-top: 1px solid #e1e5ea;
            padding-top: 15px;
        }
    </style>
</head>

<body>

<div class="container">
    <header>
        <h1>NON-QUOTA NOTES</h1>
        <p>First Year • Academic Resources</p>
    </header>

    <section class="courses">
        <a href="MA110/" class="card">
            <div class="code">MA110</div>
            <div class="name">Mathematics</div>
        </a>

        <a href="CH110/" class="card">
            <div class="code">CH110</div>
            <div class="name">Chemistry</div>
        </a>

        <a href="CS110/" class="card">
            <div class="code">CS110</div>
            <div class="name">Computer Studies</div>
        </a>

        <a href="BI110/" class="card">
            <div class="code">BI110</div>
            <div class="name">Biology</div>
        </a>

        <a href="PH110/" class="card">
            <div class="code">PH110</div>
            <div class="name">Physics</div>
        </a>
    </section>

    <footer>
        Official NON-QUOTA Academic Notes Repository
    </footer>
</div>

</body>
  </html>
