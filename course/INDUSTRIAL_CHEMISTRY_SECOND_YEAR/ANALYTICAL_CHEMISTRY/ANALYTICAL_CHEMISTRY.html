<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Analytical Chemistry | PMG</title>
  <link rel="stylesheet" href="../../css/styles.css" />
</head>
<body>
  <header class="container">
    <h1 class="glow">Analytical Chemistry</h1>
    <p class="small-note">Tests, notes, and practicals for Analytical Chemistry.</p>
  </header>

  <main class="container">
    <section class="section card">
      <div class="flex" style="gap:12px;">
        <button class="btn" onclick="document.getElementById('ANAL-years').scrollIntoView({behavior:'smooth'})">Tests</button>
        <button class="btn" onclick="document.getElementById('ANAL-notes').scrollIntoView({behavior:'smooth'})">Notes</button>
      </div>

      <div id="ANAL-years" class="years" style="margin-top:18px;"></div>
      <div id="ANAL-notes" class="notes" style="margin-top:18px;"></div>

      <div id="viewer" class="viewer" style="margin-top:18px;">
        <iframe id="viewerFrame" src="" title="Document viewer"></iframe>
      </div>
    </section>
  </main>

  <footer class="container small-note">
    <p>Store tests in <code>AnalyticalChem/tests/</code> and notes in <code>AnalyticalChem/notes/</code>.</p>
  </footer>

  <script src="../../scripts/scripts.js"></script>
  <script>
    const basePath = 'course/INDUSTRIAL CHEMISTRY SECOND YEAR/AnalyticalChem';
    // If you want to add topics to notesDB, add CH key entries in scripts/scripts.js
    initCourse('ANAL', basePath, { years: [2019,2020,2021,2022,2023,2024] });
    // For notes display, showNotes expects a key in notesDB; use showNotes('ANAL-notes','CH110') if you add an entry
    // Example: showNotes('ANAL-notes','CH110');
  </script>
</body>
</html>
